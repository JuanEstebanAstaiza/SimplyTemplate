services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: simplytemplate
      POSTGRES_PASSWORD: simplytemplate
      POSTGRES_DB: simplytemplate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplytemplate -d simplytemplate"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://simplytemplate:simplytemplate@postgres:5432/simplytemplate?schema=public
      MONGO_URL: mongodb://mongo:27017/simplytemplate
      AUTH_SECRET: ${AUTH_SECRET:-cambie-esta-clave-por-una-larga-y-aleatoria}
      MAX_UPLOAD_BYTES: "15728640"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/salud').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app

volumes:
  pgdata:
  mongodata:
  caddydata:
